[package]
name = "tl"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "tl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tempfile = "3"
ratatui = "0.29"
crossterm = "0.28"
terminal-light = "1.9.0"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
tempfile = "3"
