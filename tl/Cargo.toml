[package]
name = "tl"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "tl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
