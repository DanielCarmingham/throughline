services:
  tlflow:
    image: tlflow:latest
    build:
      context: .
      # The cluster runs amd64. Without this, a build from an Apple Silicon
      # machine produces an arm64 image that dies with "exec format error".
      platforms:
        - linux/amd64
    platform: linux/amd64
    # Uncloud extension: the cluster Caddy terminates TLS and routes by
    # hostname. The standard `ports:` key cannot carry the /https protocol.
    x-ports:
      - tlflow.cc:80/https
      - www.tlflow.cc:80/https
      # Interim hostname on the existing wildcard, so the site is reachable
      # while the tlflow.cc zone activates. Safe to drop afterwards.
      - tlflow.digilope.com:80/https
