name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both host architectures, natively — the TUI and the terminal
        # detection are the parts most likely to differ between them.
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The suite asserts docs/manual.md matches the binary and that
      # docs/method.md matches `tlflow diagram`, so documentation drift fails
      # here rather than reaching a reader.

  site:
    name: site builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

  deploy-site:
    name: deploy site
    runs-on: ubuntu-24.04
    needs: [rust, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: site-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy-site
        with:
          connect: ${{ secrets.UNCLOUD_CONNECT }}
          ssh-private-key: ${{ secrets.UNCLOUD_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.UNCLOUD_SSH_KNOWN_HOSTS }}
          image-tag: ${{ github.sha }}
